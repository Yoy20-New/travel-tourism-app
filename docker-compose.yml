version: '3.8'

services:
  # MongoDB for development
  mongo:
    image: mongo:6
    container_name: travel-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: tourify
    volumes:
      - mongo_data:/data/db
    networks:
      - travel-network

  # Optional: Mongo Express UI
  mongo-express:
    image: mongo-express:1.0.2-18
    container_name: travel-mongo-express
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    ports:
      - "8081:8081"
    networks:
      - travel-network

  # Backend API (optional to run via Docker; recommended to run locally in dev)
  backend:
    build: ./backend
    container_name: travel-backend
    environment:
      MONGODB_URI: mongodb://mongo:27017/tourify
      JWT_SECRET: your_development_jwt_secret_key
      NODE_ENV: development
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      - mongo
    networks:
      - travel-network
    command: npm run dev

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: travel-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - travel-network
    command: npm run dev

volumes:
  mongo_data:

networks:
  travel-network:
    driver: bridge
